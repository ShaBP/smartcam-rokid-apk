<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SmartCam recording screen</title>
  <desc id="desc">Representative view of SmartCam running on Rokid AI Glasses, with recording timer, battery, MARK, PAUSE and STOP controls.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#173c59"/><stop offset=".62" stop-color="#416d79"/><stop offset="1" stop-color="#20352f"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5d635f"/><stop offset="1" stop-color="#222a28"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="675" rx="30" fill="url(#sky)"/>
  <circle cx="973" cy="115" r="62" fill="#f4cf83" opacity=".6"/>
  <path d="M0 365 C175 300 280 350 430 292 C585 232 735 330 890 266 C1010 216 1090 246 1200 205 V675 H0Z" fill="#183b31"/>
  <path d="M0 510 C210 475 355 455 530 444 C735 431 910 455 1200 385 V675 H0Z" fill="url(#road)"/>
  <path d="M466 675 L590 444 L660 444 L785 675" fill="#89908b" opacity=".72"/>
  <path d="M605 650 L621 470" stroke="#f6f0c8" stroke-width="7" stroke-dasharray="28 25" opacity=".9"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#fff" filter="url(#shadow)">
    <text x="48" y="61" font-size="28" font-weight="700">SMARTCAM <tspan fill="#68e5ff">PRO</tspan></text>
    <circle cx="524" cy="50" r="8" fill="#ff3d48"/>
    <text x="546" y="61" font-size="31" font-weight="700">REC  00:04:28</text>
    <rect x="1040" y="31" width="84" height="34" rx="7" fill="none" stroke="#fff" stroke-width="4"/>
    <rect x="1125" y="40" width="9" height="16" rx="3" fill="#fff"/>
    <rect x="1047" y="38" width="61" height="20" rx="3" fill="#7ee8a2"/>
    <text x="980" y="61" font-size="25" font-weight="700">72%</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="254" y="548" width="205" height="76" rx="18" fill="#04a8c7" fill-opacity=".92" stroke="#baf6ff" stroke-width="2"/>
    <text x="357" y="596" fill="#fff" font-size="29" font-weight="700">MARK</text>
    <rect x="497" y="548" width="205" height="76" rx="18" fill="#111b21" fill-opacity=".86" stroke="#fff" stroke-opacity=".75" stroke-width="2"/>
    <text x="600" y="596" fill="#fff" font-size="29" font-weight="700">PAUSE</text>
    <rect x="741" y="548" width="205" height="76" rx="18" fill="#b72837" fill-opacity=".92" stroke="#ffc4ca" stroke-width="2"/>
    <text x="844" y="596" fill="#fff" font-size="29" font-weight="700">STOP</text>
    <rect x="427" y="461" width="346" height="52" rx="24" fill="#071117" fill-opacity=".74"/>
    <text x="600" y="495" fill="#fff" font-size="23" font-weight="600">1 MIN INTERVAL  •  RECORDING</text>
  </g>
</svg>
